; Config for read.py / write.py.
;
; [serial] is what the Python scripts actually use at runtime.
; [pins] is reference only, for wiring the board - it documents the pins
; set at the top of rc522.c. Editing a value here does NOT reconfigure
; the Arduino; change rc522.c and re-flash it too.

[serial]
; macOS: run `ls /dev/cu.*` while the Arduino is plugged in to find this.
; Linux: usually /dev/ttyACM0 or /dev/ttyUSB0.
; Windows: COM3, COM4, etc. - check Device Manager.
port = /dev/cu.usbmodem21401
baud = 115200
; How long (seconds) to wait for a response line before giving up.
; Must be LONGER than the sketch's own wait-for-tag timeout (TAG_WAIT_MS
; in nfc_app.c, 10s), or we give up listening before the Arduino replies.
timeout = 12
; How long (seconds) to wait after opening the port before sending
; anything - opening the port resets most Arduino boards, and the sketch
; needs a moment to boot.
boot_delay = 2

[pins]
rst = 9
sda_ss = 10
sck = 13
mosi = 11
miso = 12
